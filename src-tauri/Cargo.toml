[package]
name = "RapidRAW"
description = "A blazingly-fast, non-destructive, and GPU-accelerated RAW image editor built with performance in mind."
authors = ["Timon Käch"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "rapidraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
tethering = ["dep:gphoto2"]

[dependencies]
tauri = { version = "2.11", features = [ "macos-private-api", "rustls-tls", "protocol-asset" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.10"
base64 = "0.23"
tauri-plugin-fs = "2.5.1"
rayon = "1.12.0"
blake3 = "1.8.7"
wgpu = "29.0" # Downgraded to prevent P3 color shifts on Apple devices
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0.104"
kamadak-exif = "0.6.1"
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.25", features = ["v4", "serde"] }
walkdir = "2.5.0"
imageproc = "0.27.0"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic"] }
ndarray = "0.16"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"
log = "0.4"
fern = "0.7"
little_exif = "0.6.23"
chrono = "0.4"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
once_cell = "1.21"
futures = "0.3.34"
sha2 = "0.11"
nalgebra = "0.35.0"
hex = "0.4"
rand = "0.10"
tauri-plugin-shell = "2.3.5"
tempfile = "3.27.0"
image_hasher = "3.1.1"
regex = "1.13.1"
memmap2 = "0.9.11"
half = { version = "2.7.1", features = ["bytemuck"] }
glam = "0.33.5"
quick-xml = { version = "0.41", features = ["serialize"] }
fuzzy-matcher = "0.3.7"
image-hdr = { version = "0.6.0", default-features = false }
mozjpeg-rs = "0.9.2"
webp = "0.3"
jxl-oxide = { version = "0.12.6", features = ["image"] }
jxl-encoder = "0.3.1"
filetime = "0.2"
libc = "0.2.189"
rgb = "0.8.53"
imgref = "1.12.2"
sysinfo = "0.39.6"

# Desktop platforms only. OpenHarmony (`*-unknown-linux-ohos`) reports
# `target_os = "linux"` + `target_env = "ohos"` and must be excluded here:
# trash (freedesktop) and tauri-plugin-single-instance are desktop-only.
[target.'cfg(any(target_os = "windows", target_os = "macos", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
trash = "5.2.6"
tauri-plugin-single-instance = "2.4.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }

# gphoto2 (tethering) is POSIX desktop-only; excluded on OpenHarmony.
[target.'cfg(any(target_os = "macos", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
gphoto2 = { git = "https://github.com/CyberTimon/libgphoto2-rs", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
    "NSData",
    "NSDictionary",
    "NSString",
    "NSURL",
    "NSValue",
    "NSArray",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace"] }
objc2-core-image = { version = "0.3.2", features = [
    "CIContext",
    "CIFilter",
    "CIImage",
    "CIRAWFilter",
] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"
jni22 = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
include_dir = "0.7.4"

# GTK/WebKit2GTK are desktop Linux only; OpenHarmony uses ArkWeb via the
# tauri `feat/open-harmony` fork instead.
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
gtk = "0.18.2"
webkit2gtk = "=2.0.2"
tauri-plugin-wayland-nvidia-quirk = "0.1.0"

# OpenHarmony (OHOS): reqwest is required for AI model / LUT downloads,
# mirroring the Android dependency set. TLS currently uses bundled webpki
# roots (rustls-platform-verifier has no OHOS backend yet).
# napi-ohos / napi-derive-ohos: the `tauri::mobile_entry_point` expansion
# (openharmony-ability `#[ability]` derive) emits bare `::napi_ohos` /
# `::napi_derive_ohos` paths into the app crate, so they must be declared here.
[target.'cfg(target_env = "ohos")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
napi-ohos = { version = "1.2", features = ["napi8"] }
napi-derive-ohos = "1.2"
# include_dir: embed lensfun_db into the .so (mirrors the Android path; see
# lens_correction.rs). Bundle-resource resolution into the HAP is unverified
# on OHOS, embedding is the proven mobile route and lands in the HAP via the lib.
include_dir = "0.7.4"

# mimalloc is not yet validated on OHOS; it falls back to the system allocator there.
# tauri-plugin-dialog: rfd's Linux backend links GTK and has no OHOS backend;
# excluded on OpenHarmony (frontend uses OHOS FileKit, see porting doc Phase 2).
[target.'cfg(not(target_env = "ohos"))'.dependencies]
mimalloc = "0.1.52"
tauri-plugin-dialog = "2.7.2"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
hex = "0.4"

[profile.dev]
opt-level = 2
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# ---------------------------------------------------------------------------
# OpenHarmony support: patched to the tauri-apps `feat/open-harmony` forks.
#
# Upstream tauri 2.12 has no OHOS support: its Linux/webview stack assumes
# GTK/WebKit2GTK, and OHOS (`aarch64-unknown-linux-ohos`) reports
# target_os = "linux" + target_env = "ohos". The forks gate the desktop stack
# behind `not(target_env = "ohos")` and add ArkWeb/wry backends instead.
#
# - tauri / tauri-build / tauri-runtime / tauri-runtime-wry / tauri-utils /
#   tauri-macros  -> github.com/tauri-apps/tauri  (branch feat/open-harmony)
# - wry (0.56)    -> github.com/tauri-apps/wry    (branch feat/open-harmony)
# - tao (0.36)    -> github.com/tauri-apps/tao    (branch feat/open-harmony)
#
# - ash (0.38.0+1.3.281) -> vendored path checkout with a one-branch OHOS fix:
#   upstream `Entry::load()` resolves `libvulkan.so.1` on any non-Android Unix,
#   but OHOS (target_os = "linux" + target_env = "ohos") only ships
#   /system/lib64/libvulkan.so. The vendor adds an `ohos` cfg branch so wgpu's
#   Vulkan backend can reach the loader (porting doc 6.9; the Maleoon GLES
#   translation layer crashes on readback, making Vulkan the only viable
#   real-device backend). Delete when ash gains OHOS support upstream.
#
# openharmony-ability is vendored at rev 295a276a (crates/ability + crates/derive,
# version 0.3.0): current upstream master (1.0.0-beta.x) removed the `webview`
# feature that the wry fork requires. Cargo cannot patch a git source with
# itself, so the pin is a committed path checkout instead (same rev as
# richerfu/tauri-demo uses). Cargo's `[patch]` cannot pin same-source-different-rev.
#
# When OHOS support ships in an upstream tauri release, delete both patch
# sections, restore `tauri = "2.12"`+ and refresh Cargo.lock.
# ---------------------------------------------------------------------------

[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
wry = { git = "https://github.com/tauri-apps/wry", branch = "feat/open-harmony" }
tao = { git = "https://github.com/tauri-apps/tao", branch = "feat/open-harmony" }
ash = { path = "vendor/ash" }

[patch."https://github.com/harmony-contrib/openharmony-ability.git"]
openharmony-ability = { path = "vendor/openharmony-ability/crates/ability" }
openharmony-ability-derive = { path = "vendor/openharmony-ability/crates/derive" }
